name: Capture gameplay highlights

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false

      - name: Import Godot resources
        run: godot --headless --path . --import

      - name: Capture eight actual gameplay views
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          mkdir -p build/highlights
          timeout 120s xvfb-run -a godot --path . --script res://tools/capture_highlights.gd --rendering-method gl_compatibility -- --unlock-routes

      - name: Upload PNG screenshots
        uses: actions/upload-artifact@v4
        with:
          name: RUN_UNIT-clean-layout
          path: build/highlights/*.png
          if-no-files-found: error
          retention-days: 14
